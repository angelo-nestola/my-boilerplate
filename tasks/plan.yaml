          Usa React Query per fetch dati utente.
          Pattern: pagine sono container, delegano UI a components/.
        status: done
        labels:
          - frontend
          - dashboard
          - ui
        subtasks:
          - Create features/dashboard/types.ts
          - Create features/profile/api.ts and hooks.ts
          - Create app/(dashboard)/dashboard/page.tsx
          - Create app/(dashboard)/profile/page.tsx

  - id: phase-14
    name: "Phase 14: Frontend Documentation"
    tasks:
      - id: task-14-1

          - Header.tsx: top bar con user menu
          - DashboardLayout.tsx: composizione layout completo

          app/(dashboard)/layout.tsx: layout condiviso
          Usa AuthGuard per proteggere tutte le route dashboard.

          Responsive design: sidebar collassa su mobile.
        status: done
        labels:
          - frontend
          - layout
          - ui
        subtasks:
          - Create components/layout/Sidebar.tsx
          - Create components/layout/Header.tsx
          - Create components/layout/DashboardLayout.tsx
          - Create app/(dashboard)/layout.tsx

  - id: phase-13
    name: "Phase 13: Dashboard Pages"
    tasks:
      - id: task-13-1
        title: "Create dashboard and profile pages"
        description: |
          Implementare pagine dashboard:

          app/(dashboard)/dashboard/page.tsx:
          - Pagina home con statistiche placeholder
